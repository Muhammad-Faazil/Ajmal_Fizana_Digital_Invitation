<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Elegant drop shadow matching Maison Dorée depth -->
    <filter id="monogramShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3b4c30" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#monogramShadow)" fill="#47543a">
    <!-- Ornamental Circular Crest Ring with Botanical Leaves -->
    <circle cx="250" cy="250" r="225" fill="none" stroke="#47543a" stroke-width="2.5" opacity="0.45" stroke-dasharray="12 4" />
    <circle cx="250" cy="250" r="215" fill="none" stroke="#47543a" stroke-width="1.2" opacity="0.75" />

    <!-- Top & Bottom Crest Florals -->
    <!-- Top Floral Crown -->
    <path d="M 250 20 C 245 32, 230 42, 218 45 C 232 46, 244 54, 250 65 C 256 54, 268 46, 282 45 C 270 42, 255 32, 250 20 Z" />
    <circle cx="250" cy="42" r="3.5" opacity="0.8" />
    <circle cx="236" cy="45" r="2" opacity="0.6" />
    <circle cx="264" cy="45" r="2" opacity="0.6" />

    <!-- Bottom Floral Accent -->
    <path d="M 250 480 C 245 468, 230 458, 218 455 C 232 454, 244 446, 250 435 C 256 446, 268 454, 282 455 C 270 458, 255 468, 250 480 Z" />
    <circle cx="250" cy="458" r="3.5" opacity="0.8" />
    <circle cx="236" cy="455" r="2" opacity="0.6" />
    <circle cx="264" cy="455" r="2" opacity="0.6" />

    <!-- Left & Right Delicate Leaf Sprigs -->
    <path d="M 35 250 C 47 245, 57 230, 60 218 C 61 232, 69 244, 80 250 C 69 256, 61 268, 60 282 C 57 270, 47 255, 35 250 Z" opacity="0.8" />
    <path d="M 465 250 C 453 245, 443 230, 440 218 C 439 232, 431 244, 420 250 C 431 256, 439 268, 440 282 C 443 270, 453 255, 465 250 Z" opacity="0.8" />

    <!-- Intertwined Primary 'M' (Maziya) - Left Shifted Calligraphic -->
    <g transform="translate(-25, 0)">
      <!-- Left Stem with Flourish -->
      <path d="M 125 150 C 135 148, 148 142, 160 135 C 158 155, 155 200, 155 260 C 155 315, 152 345, 142 355 C 135 362, 122 365, 110 364 C 115 360, 128 352, 134 340 C 142 325, 144 290, 144 240 C 144 190, 145 160, 135 152 C 130 148, 122 150, 125 150 Z" />
      <path d="M 160 135 C 175 165, 210 240, 230 285 C 240 260, 260 200, 275 140 C 265 140, 255 143, 250 148 C 255 142, 270 135, 285 135 C 275 165, 238 275, 230 298 C 224 285, 185 195, 160 135 Z" />
      <!-- Right Stem with Flourish Curve -->
      <path d="M 285 135 C 295 165, 305 235, 305 285 C 305 325, 310 350, 325 358 C 335 363, 350 360, 360 350 C 352 355, 340 355, 332 348 C 322 338, 318 315, 318 275 C 318 220, 312 165, 300 145 C 295 138, 288 135, 285 135 Z" />
    </g>

    <!-- Intertwined Secondary 'M' (Mufeed) - Shifted Down & Right with Golden Ratio Overlap -->
    <g transform="translate(35, 25)" opacity="0.95">
      <!-- Left Stem -->
      <path d="M 140 165 C 148 163, 160 157, 172 150 C 170 170, 167 215, 167 275 C 167 330, 164 360, 154 370 C 147 377, 134 380, 122 379 C 127 375, 140 367, 146 355 C 154 340, 156 305, 156 255 C 156 205, 157 175, 147 167 C 143 164, 137 165, 140 165 Z" />
      <path d="M 172 150 C 187 180, 222 255, 242 300 C 252 275, 272 215, 287 155 C 277 155, 267 158, 262 163 C 267 157, 282 150, 297 150 C 287 180, 250 290, 242 313 C 236 300, 197 210, 172 150 Z" />
      <!-- Right Stem with Grand Flourish -->
      <path d="M 297 150 C 307 180, 317 250, 317 300 C 317 340, 322 365, 337 373 C 347 378, 362 375, 372 365 C 364 370, 352 370, 344 363 C 334 353, 330 330, 330 290 C 330 235, 324 180, 312 160 C 307 153, 300 150, 297 150 Z" />
    </g>

    <!-- Center Ampersand Ribbon Ligature -->
    <path d="M 245 220 C 235 210, 225 215, 225 225 C 225 235, 235 245, 250 255 C 265 265, 275 278, 275 292 C 275 310, 258 322, 238 322 C 220 322, 205 310, 205 295 C 205 285, 212 278, 220 278 C 228 278, 234 285, 234 292 C 234 300, 228 306, 220 306 C 225 312, 232 315, 240 315 C 252 315, 262 305, 262 292 C 262 280, 252 270, 238 260 C 224 250, 212 238, 212 222 C 212 205, 228 195, 245 195 C 258 195, 268 202, 274 212 C 270 216, 258 220, 245 220 Z" opacity="0.85" />
    <!-- Ampersand trailing curl -->
    <path d="M 252 285 C 265 298, 280 312, 298 322 C 290 322, 275 315, 265 305 Z" opacity="0.85" />

    <!-- Ornate Micro-flourishes -->
    <circle cx="250" cy="180" r="2.5" opacity="0.6" />
    <circle cx="250" cy="340" r="2.5" opacity="0.6" />
  </g>
</svg>
